name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        type: choice
        options:
          - latest
          - staging

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # CI — laeuft bei jedem Push und PR
  # ============================================

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Import-Check
        run: python -c "from app.main import app; print('Import OK')"
        env:
          JWT_SECRET: ci-dummy-secret
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci

  # ============================================
  # Tests — Unit- und Integration-Tests
  # ============================================

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Tests ausfuehren
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          JWT_SECRET: ci-test-secret
          BCRYPT_ROUNDS: '4'
          ENV: testing

  # ============================================
  # CD — Docker Build & Push to Docker Hub
  # ============================================

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: [build-check, test]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            servecta/intranet-backend:${{ steps.tag.outputs.tag }}
            servecta/intranet-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
