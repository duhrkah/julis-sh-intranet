name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        type: choice
        options:
          - latest
          - staging

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # CI — laeuft bei jedem Push und PR
  # ============================================

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Build verifizieren
        run: npm run build

  # ============================================
  # Tests — Unit Tests mit Vitest
  # ============================================

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Tests ausfuehren
        run: npx vitest run
        env:
          AUTH_SECRET: ci-test-secret-32-chars-minimum!!

  # ============================================
  # CD — Docker Build & Push to Docker Hub
  # ============================================

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: [build-check, test]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            servecta/intranet-frontend:${{ steps.tag.outputs.tag }}
            servecta/intranet-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max